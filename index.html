<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatWeb 数值计算</title>
  <meta name="description" content="浏览器中的类 MATLAB 数值计算环境：矩阵运算、线性代数、数值分析、绘图与常用公式库">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231d1d1f'/%3E%3Cpath d='M14 44 L26 22 L35 36 L41 28 L50 44' fill='none' stroke='%23fff' stroke-width='5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // 尽早设置主题，避免闪烁
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('matweb.theme')); } catch (e) { t = null; }
      if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
    // 静态托管（如 GitHub Pages）下通过 Service Worker 启用跨源隔离，首次注册后自动刷新一次
    (function () {
      if (window.crossOriginIsolated || location.protocol !== 'https:' || !('serviceWorker' in navigator)) return;
      navigator.serviceWorker.register('coi-sw.js').then(function (reg) {
        if (navigator.serviceWorker.controller || sessionStorage.getItem('matweb.coi')) return;
        sessionStorage.setItem('matweb.coi', '1');
        var reload = function () { location.reload(); };
        if (reg.active) reload();
        else navigator.serviceWorker.addEventListener('controllerchange', reload);
      }).catch(function () { /* 不支持时退回普通 Worker 模式 */ });
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 线性图标（lucide 风格，strokeWidth 1.75） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 18v-6"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-step" viewBox="0 0 24 24"><path d="M5 4v16"/><path d="M10 5.5v13a1 1 0 0 0 1.5.86l9-6.5a1 1 0 0 0 0-1.72l-9-6.5A1 1 0 0 0 10 5.5z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect width="14" height="14" x="5" y="5" rx="2.5"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  </defs>
</svg>

<div id="app">
  <header id="toolbar">
    <div class="brand">
      <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 18 L9 8 L13 14.5 L15.5 11 L20 18"/></svg></span>
      <span class="brand-text"><span class="brand-name">MatWeb</span><span class="brand-sub">数值计算环境</span></span>
    </div>
    <div class="tb-group">
      <button id="btnNew" class="btn" title="新建脚本 (Ctrl+N)"><svg class="ico"><use href="#i-file-plus"/></svg><span>新建</span></button>
      <button id="btnSave" class="btn" title="保存 (Ctrl+S)"><svg class="ico"><use href="#i-save"/></svg><span>保存</span></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <button id="btnRun" class="btn btn-primary" title="运行当前脚本 (F5)"><svg class="ico fill"><use href="#i-play"/></svg><span>运行</span></button>
      <button id="btnSection" class="btn" title="运行当前节 —— 以 %% 分隔 (Ctrl+Enter)"><svg class="ico"><use href="#i-step"/></svg><span>运行节</span></button>
      <button id="btnStop" class="btn btn-danger" title="停止运行 (Ctrl+C)" disabled><svg class="ico fill"><use href="#i-stop"/></svg><span>停止</span></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <button id="btnClc" class="btn" title="清空命令行窗口 (clc)"><svg class="ico"><use href="#i-eraser"/></svg><span>清空命令行</span></button>
      <button id="btnClear" class="btn" title="清空工作区 (clear)"><svg class="ico"><use href="#i-trash"/></svg><span>清空工作区</span></button>
      <button id="btnCloseFigs" class="btn" title="关闭所有图窗 (close all)"><svg class="ico"><use href="#i-x"/></svg><span>关闭图窗</span></button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <select id="selExamples" class="select" title="打开示例程序"><option value="">示例程序</option></select>
      <select id="selFormat" class="select" title="数值显示格式">
        <option value="short">format short</option>
        <option value="long">format long</option>
        <option value="shortg">format shortG</option>
        <option value="longg">format longG</option>
        <option value="shorte">format shortE</option>
        <option value="rat">format rat</option>
      </select>
    </div>
    <div class="tb-right">
      <button id="btnAI" class="btn btn-ghost" title="打开 AI 助手（Claude）"><svg class="ico"><use href="#i-sparkles"/></svg><span>AI 助手</span></button>
      <button id="btnTheme" class="tb-round" title="切换深色/浅色主题"><svg class="ico"><use href="#i-moon"/></svg></button>
      <button id="btnHelp" class="tb-round" title="使用帮助"><svg class="ico"><use href="#i-help"/></svg></button>
    </div>
  </header>

  <main id="layout">
    <aside id="left" class="column">
      <section class="panel" id="panelFiles" style="flex-basis:38%">
        <div class="panel-head">
          <span class="panel-title">当前文件夹</span>
          <div class="panel-actions">
            <button id="btnNewFile" class="icon-btn" title="新建文件"><svg class="ico"><use href="#i-plus"/></svg></button>
            <button id="btnUpload" class="icon-btn" title="导入本地文件（.m / .csv / .txt）"><svg class="ico"><use href="#i-upload"/></svg></button>
            <button id="btnDownload" class="icon-btn" title="下载选中的文件"><svg class="ico"><use href="#i-download"/></svg></button>
            <button id="btnDeleteFile" class="icon-btn" title="删除选中的文件"><svg class="ico"><use href="#i-trash"/></svg></button>
          </div>
        </div>
        <ul id="fileList" class="list"></ul>
        <input type="file" id="fileInput" multiple accept=".m,.csv,.txt,.dat,.mat,.json" hidden>
      </section>
      <div class="hsplit" data-prev="panelFiles"></div>
      <section class="panel grow" id="panelWorkspace">
        <div class="panel-head">
          <span class="panel-title">工作区</span>
          <div class="panel-actions"><button id="btnClearWs" class="icon-btn" title="清空工作区"><svg class="ico"><use href="#i-trash"/></svg></button></div>
        </div>
        <div class="table-wrap">
          <table id="wsTable">
            <thead><tr><th>名称</th><th>值</th><th>大小</th><th>类</th></tr></thead>
            <tbody></tbody>
          </table>
          <div id="wsEmpty" class="empty"><svg class="empty-ico"><use href="#i-box"/></svg><div>工作区为空</div><small>在命令行输入 x = 1 试试</small></div>
        </div>
      </section>
    </aside>
    <div class="vsplit" data-side="left"></div>

    <section id="center" class="column">
      <section class="panel" id="panelEditor" style="flex-basis:52%">
        <div class="panel-head tabs-head">
          <div id="editorTabs" class="tabs"></div>
          <div class="panel-actions"><span id="editorInfo" class="state-tag"></span></div>
        </div>
        <div id="editorHost" class="editor-host"></div>
      </section>
      <div class="hsplit" data-prev="panelEditor"></div>
      <section class="panel grow" id="panelConsole">
        <div class="panel-head">
          <span class="panel-title">命令行窗口</span>
          <div class="panel-actions"><span id="busyIndicator" class="state-tag busy" hidden>正在运行</span></div>
        </div>
        <div id="console" class="console" tabindex="-1">
          <div id="consoleOut" class="console-out"></div>
          <div class="console-input-row">
            <span id="prompt" class="prompt">&gt;&gt;</span>
            <textarea id="consoleIn" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="命令输入"></textarea>
          </div>
          <ul id="completion" class="completion" hidden></ul>
        </div>
      </section>
    </section>
    <div class="vsplit" data-side="right"></div>

    <aside id="right" class="column">
      <section class="panel" id="panelFigures" style="flex-basis:56%">
        <div class="panel-head tabs-head">
          <div id="figTabs" class="tabs"></div>
          <div class="panel-actions">
            <button id="btnFigReset" class="icon-btn" title="复位三维视角"><svg class="ico"><use href="#i-rotate"/></svg></button>
            <button id="btnFigExport" class="icon-btn" title="导出为 PNG 图片"><svg class="ico"><use href="#i-image"/></svg></button>
            <button id="btnFigMax" class="icon-btn" title="放大/还原图窗"><svg class="ico"><use href="#i-maximize"/></svg></button>
            <button id="btnFigClose" class="icon-btn" title="关闭当前图窗"><svg class="ico"><use href="#i-x"/></svg></button>
          </div>
        </div>
        <div id="figHost" class="fig-host">
          <div id="figEmpty" class="empty"><svg class="empty-ico"><use href="#i-chart"/></svg><div>暂无图窗</div><small>试试 <code>plot(sin(0:0.1:2*pi))</code> 或 <code>surf(peaks)</code></small></div>
        </div>
        <div id="figStatus" class="fig-status"></div>
      </section>
      <div class="hsplit" data-prev="panelFigures"></div>
      <section class="panel grow" id="panelTools">
        <div class="panel-head tabs-head">
          <div class="tabs seg" id="toolTabs">
            <button class="tab active" data-tool="ai">AI 助手</button>
            <button class="tab" data-tool="formulas">公式库</button>
            <button class="tab" data-tool="functions">函数参考</button>
            <button class="tab" data-tool="history">命令历史</button>
          </div>
        </div>
        <div class="tool-body">
          <div class="tool-pane active" id="tool-ai">
            <div class="ai-head">
              <span id="aiModelBadge" class="ai-badge"></span>
              <span class="spacer"></span>
              <button id="aiNew" class="icon-btn" title="新对话"><svg class="ico"><use href="#i-pen"/></svg></button>
              <button id="aiSettings" class="icon-btn" title="AI 设置（API Key、模型）"><svg class="ico"><use href="#i-sliders"/></svg></button>
            </div>
            <div id="aiLog" class="ai-log"></div>
            <div class="ai-foot">
              <div class="ai-meta"><span id="aiStatus" class="state-tag busy" hidden>Claude 正在工作</span><span id="aiUsage" class="muted tabular"></span></div>
              <div class="ai-input-wrap">
                <textarea id="aiInput" rows="1" placeholder="让 AI 帮你完成 MATLAB 任务…（Enter 发送，Shift+Enter 换行）" spellcheck="false"></textarea>
                <button id="aiSend" class="ai-send" title="发送"><svg class="ico"><use href="#i-send"/></svg></button>
                <button id="aiStop" class="ai-send stop" title="停止" hidden><svg class="ico fill"><use href="#i-stop"/></svg></button>
              </div>
            </div>
          </div>
          <div class="tool-pane" id="tool-formulas">
            <label class="search"><svg class="ico"><use href="#i-search"/></svg><input id="formulaSearch" placeholder="搜索公式，如：求根、积分、复利…"></label>
            <div id="formulaList" class="formula-list"></div>
          </div>
          <div class="tool-pane" id="tool-functions">
            <label class="search"><svg class="ico"><use href="#i-search"/></svg><input id="funcSearch" placeholder="搜索函数，如：eig、积分、plot…"></label>
            <div id="funcList" class="func-list"></div>
          </div>
          <div class="tool-pane" id="tool-history">
            <div class="pane-actions"><button id="btnClearHistory" class="btn btn-sm">清空历史</button></div>
            <ul id="historyList" class="list history"></ul>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="status" class="state">正在启动计算引擎…</span>
    <span id="engineMode" class="muted"></span>
    <span class="spacer"></span>
    <span id="cursorPos" class="muted tabular"></span>
  </footer>
</div>

<div id="modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle"></span><button id="modalClose" class="modal-x" title="关闭"><svg class="ico"><use href="#i-x"/></svg></button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- 计算引擎（与 Worker 共用；主线程用于文档、渲染以及在 file:// 下的回退执行） -->
<script src="js/manifest.js"></script>
<script src="js/core/types.js"></script>
<script src="js/core/colormaps.js"></script>
<script src="js/core/ops.js"></script>
<script src="js/core/linalg.js"></script>
<script src="js/core/lexer.js"></script>
<script src="js/core/parser.js"></script>
<script src="js/core/format.js"></script>
<script src="js/core/indexing.js"></script>
<script src="js/lib/registry.js"></script>
<script src="js/lib/elmat.js"></script>
<script src="js/lib/elfun.js"></script>
<script src="js/lib/datafun.js"></script>
<script src="js/lib/matfun.js"></script>
<script src="js/lib/numeric.js"></script>
<script src="js/lib/strfun.js"></script>
<script src="js/lib/datatypes.js"></script>
<script src="js/lib/system.js"></script>
<script src="js/lib/graphics.js"></script>
<script src="js/lib/extras.js"></script>
<script src="js/core/interp.js"></script>
<!-- 界面 -->
<script src="js/ui/render.js"></script>
<script src="js/ui/engine-client.js"></script>
<script src="js/ui/highlight.js"></script>
<script src="js/ui/editor.js"></script>
<script src="js/ui/formulas.js"></script>
<script src="js/ui/examples.js"></script>
<script src="js/ui/app.js"></script>
<script src="js/ui/ai.js"></script>
</body>
</html>
